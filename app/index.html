<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ResponsiveController</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link
            rel="icon"
            href="/favicon-32.png"
            sizes="32x32"
            type="image/png"
        />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/styles/main.css" />
    </head>
    <body>
        <header class="topbar">
            <a class="logo" href="/">
                Responsive<span class="logo-accent">Controller</span>
            </a>
            <span class="project-chip" id="project-chip" hidden>
                <span aria-hidden="true">📦</span>
                <span class="project-name" id="project-name"></span>
                <button
                    class="project-close"
                    id="project-close"
                    type="button"
                    data-i18n-label="project.close"
                >
                    <span aria-hidden="true">✕</span>
                </button>
            </span>
            <form class="url-form" id="url-form" novalidate>
                <label
                    class="visually-hidden"
                    for="url-input"
                    id="url-label"
                    data-i18n="header.urlLabel"
                    >Test edilecek sitenin adresi</label
                >
                <input
                    id="url-input"
                    type="text"
                    inputmode="url"
                    autocomplete="url"
                    spellcheck="false"
                    aria-describedby="url-error"
                    data-i18n-placeholder="header.urlPlaceholder"
                />
                <button
                    class="button-primary"
                    type="submit"
                    data-i18n="header.open"
                >
                    Aç
                </button>
                <p class="url-error" id="url-error" aria-live="polite"></p>
            </form>
            <button
                class="button-ghost upload-button"
                id="upload-button"
                type="button"
            >
                <span aria-hidden="true">↑</span>
                <span class="upload-label" data-i18n="header.upload"
                    >Yükle</span
                >
            </button>
            <div class="topbar-actions">
                <button
                    class="button-ghost"
                    id="language-toggle"
                    type="button"
                    data-i18n-label="header.switchLanguage"
                >
                    EN
                </button>
                <button class="button-ghost" id="theme-toggle" type="button">
                    <span aria-hidden="true">◐</span>
                </button>
            </div>
            <p
                class="visually-hidden"
                id="app-status"
                role="status"
                aria-live="polite"
            ></p>
        </header>

        <div class="workspace">
            <aside class="sidebar" id="sidebar" aria-labelledby="sidebar-title">
                <button
                    class="sheet-toggle"
                    id="sheet-toggle"
                    type="button"
                    aria-controls="sidebar-panel"
                >
                    <span class="sheet-handle" aria-hidden="true"></span>
                    <span id="sheet-toggle-label" data-i18n="sheet.show"
                        >Cihazları göster</span
                    >
                </button>
                <div class="sidebar-panel" id="sidebar-panel">
                    <h2
                        class="sidebar-title"
                        id="sidebar-title"
                        data-i18n="sidebar.title"
                    >
                        Cihazlar
                    </h2>
                    <label
                        class="visually-hidden"
                        for="device-search"
                        data-i18n="sidebar.searchLabel"
                        >Cihaz ara</label
                    >
                    <input
                        class="device-search"
                        id="device-search"
                        type="search"
                        autocomplete="off"
                        data-i18n-placeholder="sidebar.searchPlaceholder"
                    />
                    <div
                        class="tabs"
                        id="device-tabs"
                        role="tablist"
                        aria-labelledby="sidebar-title"
                    ></div>
                    <div
                        class="device-panel"
                        id="device-list"
                        role="tabpanel"
                        tabindex="-1"
                    ></div>
                    <p
                        class="visually-hidden"
                        id="sidebar-status"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>
            </aside>

            <main class="stage" id="stage">
                <div class="view-toolbar" id="view-toolbar" hidden>
                    <div
                        class="segmented"
                        role="group"
                        aria-labelledby="view-label"
                    >
                        <span
                            class="visually-hidden"
                            id="view-label"
                            data-i18n="view.label"
                            >Görünüm</span
                        >
                        <button
                            type="button"
                            data-view="single"
                            data-i18n="view.single"
                        >
                            Tek cihaz
                        </button>
                        <button
                            type="button"
                            data-view="grid"
                            data-i18n="view.grid"
                        >
                            Izgara
                        </button>
                    </div>
                    <div
                        class="segmented"
                        id="size-group"
                        role="group"
                        aria-labelledby="size-label"
                    >
                        <span
                            class="toolbar-label"
                            id="size-label"
                            data-i18n="grid.sizeLabel"
                            >Kutu boyutu</span
                        >
                        <button
                            type="button"
                            data-size="small"
                            data-i18n="grid.sizeSmall"
                        >
                            Küçük
                        </button>
                        <button
                            type="button"
                            data-size="medium"
                            data-i18n="grid.sizeMedium"
                        >
                            Orta
                        </button>
                        <button
                            type="button"
                            data-size="large"
                            data-i18n="grid.sizeLarge"
                        >
                            Büyük
                        </button>
                    </div>
                </div>
                <div class="slow-warning" id="slow-warning" hidden>
                    <span aria-hidden="true">⚠</span>
                    <p data-i18n="slow.warning"></p>
                    <button
                        class="slow-dismiss"
                        id="slow-dismiss"
                        type="button"
                        data-i18n-label="slow.dismiss"
                    >
                        ✕
                    </button>
                </div>
                <section class="empty-state" id="empty-state">
                    <h1 data-i18n="empty.title">
                        Sitenin responsive görünümünü test et
                    </h1>
                    <p data-i18n="empty.body">
                        Yukarıya bir adres yaz ve Aç'a bas.
                    </p>
                </section>
                <section class="device-frame" id="device-frame" hidden>
                    <div class="frame-header">
                        <p class="frame-info">
                            <strong id="frame-name"></strong>
                            <span id="frame-size"></span>
                            <span class="frame-scale" id="frame-scale"></span>
                        </p>
                        <label class="frame-option" id="browser-bars-option">
                            <input type="checkbox" id="browser-bars" />
                            <span data-i18n="frame.browserBars"
                                >Tarayıcı çubukları dahil</span
                            >
                            <span
                                class="badge"
                                id="browser-bars-estimated"
                                hidden
                            ></span>
                        </label>
                        <button
                            class="warnings-toggle"
                            id="warnings-toggle"
                            type="button"
                            aria-expanded="false"
                            aria-controls="warnings-panel"
                            hidden
                        >
                            <span aria-hidden="true">⚠</span>
                            <span id="warnings-label"></span>
                            <span class="help-chevron" aria-hidden="true"
                                >▾</span
                            >
                        </button>
                    </div>
                    <p
                        class="frame-note"
                        id="frame-note"
                        data-i18n="frame.watchAdaptation"
                        hidden
                    ></p>
                    <ul class="warnings-panel" id="warnings-panel" hidden></ul>
                    <div class="frame-viewport" id="frame-viewport">
                        <iframe id="preview-iframe"></iframe>
                    </div>
                    <div class="frame-help" id="frame-help">
                        <button
                            class="help-toggle"
                            id="help-toggle"
                            type="button"
                            aria-expanded="false"
                            aria-controls="help-panel"
                        >
                            <span aria-hidden="true">ⓘ</span>
                            <span data-i18n="help.toggle"
                                >Site açılmıyor mu?</span
                            >
                            <span class="help-chevron" aria-hidden="true"
                                >▾</span
                            >
                        </button>
                        <div class="help-panel" id="help-panel" hidden>
                            <p data-i18n="help.body"></p>
                            <p data-i18n="help.bodyUserAgent"></p>
                            <button
                                class="button-ghost"
                                id="open-window"
                                type="button"
                                data-i18n="help.openWindow"
                            >
                                Bu boyutta yeni pencerede aç
                            </button>
                            <p class="help-note" data-i18n="help.note"></p>
                            <p data-i18n="help.uploadHint"></p>
                            <button
                                class="button-ghost"
                                id="help-upload"
                                type="button"
                                data-i18n="help.uploadButton"
                            >
                                Projeni yükle
                            </button>
                        </div>
                    </div>
                </section>
                <section class="grid-section" id="grid-section" hidden>
                    <p
                        class="grid-empty"
                        id="grid-empty"
                        data-i18n="grid.empty"
                        hidden
                    ></p>
                    <ul class="device-grid" id="device-grid"></ul>
                </section>
            </main>
            <div class="grid-drop-zone" id="grid-drop-zone">
                <p data-i18n="grid.dropHint"></p>
                <ul id="grid-drop"></ul>
            </div>
        </div>

        <dialog
            class="upload-dialog"
            id="upload-dialog"
            aria-labelledby="upload-title"
        >
            <div class="dialog-header">
                <h2 id="upload-title" data-i18n="upload.title">
                    Projeni yükle
                </h2>
                <button
                    class="button-icon"
                    id="upload-close"
                    type="button"
                    data-i18n-label="upload.cancel"
                >
                    <span aria-hidden="true">✕</span>
                </button>
            </div>
            <div class="dropzone" id="dropzone">
                <span aria-hidden="true">↑</span>
                <p data-i18n="upload.dropzone"></p>
            </div>
            <div class="upload-actions">
                <button
                    class="button-primary"
                    id="choose-file"
                    type="button"
                    data-i18n="upload.chooseFile"
                >
                    ZIP veya HTML seç
                </button>
                <button
                    class="button-ghost"
                    id="choose-folder"
                    type="button"
                    data-i18n="upload.chooseFolder"
                >
                    Klasör seç
                </button>
            </div>
            <p
                class="upload-note"
                id="folder-unsupported"
                data-i18n="upload.folderUnsupported"
                hidden
            ></p>
            <p class="upload-note" data-i18n="upload.limit"></p>
            <p
                class="upload-status"
                id="upload-status"
                role="status"
                aria-live="polite"
            ></p>
            <section class="source-warning" id="source-warning" hidden>
                <p data-i18n="upload.sourceWarning"></p>
                <div class="upload-actions">
                    <button
                        class="button-ghost"
                        id="source-cancel"
                        type="button"
                        data-i18n="upload.cancel"
                    >
                        Vazgeç
                    </button>
                    <button
                        class="button-primary"
                        id="source-open"
                        type="button"
                        data-i18n="upload.openAnyway"
                    >
                        Yine de aç
                    </button>
                </div>
            </section>
            <section
                class="entry-choice"
                id="entry-choice"
                aria-labelledby="entry-title"
                hidden
            >
                <h3 id="entry-title" data-i18n="upload.chooseEntry">
                    Hangi sayfayla başlansın?
                </h3>
                <ul id="entry-list"></ul>
            </section>
            <input
                id="file-input"
                type="file"
                accept=".zip,.html,.htm"
                hidden
            />
            <input
                id="folder-input"
                type="file"
                webkitdirectory
                multiple
                hidden
            />
        </dialog>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
